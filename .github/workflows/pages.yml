name: Deploy Pages

# Publishes the player runtime (kernel.js + color-utils.js + runtime.js +
# inspector.js + main.js + carts/*.js + index.html — a module split, no
# bundler, no build step: just <script src>/<script type=module> tags) as
# the site root, plus a game-authoring API reference under /spec/: the
# agent-facing skill (spec/skill/ — raw .md, fetchable with no rendering
# step, mirrors .claude/skills/urlcade/ in this repo), the human-facing
# learn site (spec/learn/ — visuals and small live demos), fixtures.md,
# and spec/index.html itself, a bare link list into all of it. See
# CLAUDE.md for how these surfaces relate to each other and to DESIGN.md.
# Deliberately does NOT publish DESIGN.md, v0/README.md, or the early
# worked examples — those are project history, kept in the repo for
# maintainers but not part of the public authoring-facing site.
#
# Play, Debug (the Cart Inspector, plus Source/Compile tabs for editing
# and recompiling a cart live), and "+ New Cart" all live on this one
# page now — there used to be a separate /compile page, folded in once it
# became clear "look at this cart's guts" and "edit this cart's guts"
# never needed to be different pages (DESIGN.md §30). All paths in
# index.html are relative to itself, not root-absolute (`/kernel.js`) —
# this site is also published from a subpath on at least one custom
# domain, where a root-absolute path resolves to the wrong place
# entirely and silently fails to load `window.UrlcadeKernel` (found the
# hard way once already, see DESIGN.md §29's postscript).

on:
  push:
    branches: [main]
    paths:
      - 'url-console/**'
      - 'spec/**'
      - '.claude/skills/urlcade/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: url-console/build-site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
