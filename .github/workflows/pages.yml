name: Deploy Pages

# Publishes url-console/v0/urlcade.html (a single self-contained file — no
# build step, no dependencies) as the site root, plus the design doc/spec/
# examples as plain, stably-pathed markdown under /spec/ (agent-fetchable
# as-is, no rendering required) and a spec/index.html for human browsing.
# See spec/index.html's own comment for why raw .md is the primary format.

on:
  push:
    branches: [main]
    paths:
      - 'url-console/**'
      - 'spec/index.html'
      - 'llms.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          set -e
          mkdir -p _site/spec/examples
          cp url-console/v0/urlcade.html _site/index.html
          cp llms.txt _site/llms.txt
          cp spec/index.html _site/spec/index.html
          cp url-console/DESIGN.md _site/spec/DESIGN.md
          cp url-console/v0/README.md _site/spec/v0-README.md
          cp url-console/examples/*.md _site/spec/examples/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
