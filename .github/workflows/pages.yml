name: Deploy Pages

# Publishes url-console/v0/urlcade.html (a single self-contained file — no
# build step, no dependencies) as the site root, plus a game-authoring API
# reference under /spec/ (agent-fetchable as-is, no rendering required) and
# a spec/index.html for human browsing. Deliberately does NOT publish
# DESIGN.md, v0/README.md, or the early worked examples — those are project
# history, kept in the repo for maintainers but not part of the public
# authoring-facing site. See spec/index.html's own comment for why raw .md
# is the primary format for what does get published.

on:
  push:
    branches: [main]
    paths:
      - 'url-console/**'
      - 'spec/index.html'
      - 'llms.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          set -e
          mkdir -p _site/spec
          cp url-console/v0/urlcade.html _site/index.html
          cp llms.txt _site/llms.txt
          cp spec/index.html _site/spec/index.html
          cp url-console/v0/kernel.js _site/spec/kernel.js
          cp url-console/v0/fixtures.md _site/spec/fixtures.md
          cp url-console/v0/AUTHORING.md _site/spec/AUTHORING.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
