name: Deploy Pages

# Publishes url-console/v0/urlcade.html (a single self-contained file — no
# build step, no dependencies) as the site root. Every "cart" for this game
# lives in the URL fragment, so serving the one runtime file is the entire
# deployment.

on:
  push:
    branches: [main]
    paths:
      - 'url-console/v0/urlcade.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp url-console/v0/urlcade.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
