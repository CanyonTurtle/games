name: Deploy Pages

# Publishes the player runtime (kernel.js + color-utils.js + runtime.js +
# inspector.js + main.js + carts/*.js + index.html — a module split, no
# bundler, no build step: just <script src>/<script type=module> tags) as
# the site root, the /compile self-serve authoring+decompiler tool under
# /compile/, and a game-authoring API reference under /spec/ (agent-
# fetchable as-is, no rendering required) plus a spec/index.html for human
# browsing. Deliberately does NOT publish DESIGN.md, v0/README.md, or the
# early worked examples — those are project history, kept in the repo for
# maintainers but not part of the public authoring-facing site. See
# spec/index.html's own comment for why raw .md is the primary format for
# what does get published.
#
# v0/*'s runtime files are copied flat to the site root (not under /v0/)
# so every fragment link ever shared against this site (`#z.<payload>` at
# the root) keeps working — that's the one URL shape this repo has always
# guaranteed stays stable. /compile's own HTML references its sibling
# runtime files with root-relative paths (`/kernel.js`, `/index.html`,
# ...) for exactly this reason, not a `../v0/...` relative path — see its
# own source.

on:
  push:
    branches: [main]
    paths:
      - 'url-console/**'
      - 'spec/index.html'
      - 'llms.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: url-console/build-site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
